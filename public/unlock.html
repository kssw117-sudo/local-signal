<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enter your code — Local Signal</title>
<style>
  body {
    margin: 0; background: #100D24; color: #F3F0FF;
    font-family: -apple-system, sans-serif; line-height: 1.6;
    position: relative; overflow-x: hidden;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.08); } }
  @keyframes orbitSat {
    0%   { transform: translate(0, 0) rotate(-6deg); }
    50%  { transform: translate(18px, -26px) rotate(10deg); }
    100% { transform: translate(0, 0) rotate(-6deg); }
  }
  .bg-glow {
    position: fixed; top: 30%; left: 50%; width: 600px; height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(242,169,59,0.14), transparent 65%);
    animation: pulseGlow 4s ease-in-out infinite; pointer-events: none;
  }
  .satellite { position: fixed; pointer-events: none; animation: orbitSat 8s ease-in-out infinite; z-index: 0; }
  .satellite.s1 { top: 6%; right: 8%; width: 90px; }
  .satellite.s2 { bottom: 8%; left: 6%; width: 56px; animation-duration: 10s; animation-delay: -3s; opacity: 0.7; }

  .wrap { max-width: 400px; width: 100%; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
  .eyebrow { text-align: center; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #F2A93B; margin-bottom: 14px; animation: fadeUp 0.5s ease both; }
  h1 {
    font-size: 30px; text-align: center; margin: 0 0 10px; font-weight: 700; line-height: 1.2;
    background: linear-gradient(90deg, #F2A93B, #E94F82);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fadeUp 0.5s ease both; animation-delay: 0.05s;
  }
  .sub { text-align: center; color: #B8B0E8; font-size: 14px; max-width: 340px; margin: 0 auto 32px; animation: fadeUp 0.5s ease both; animation-delay: 0.1s; }
  .card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
    padding: 28px; backdrop-filter: blur(10px);
    animation: fadeUp 0.5s ease both; animation-delay: 0.15s;
  }
  input {
    width: 100%; box-sizing: border-box; border-radius: 8px; padding: 12px 14px; font-size: 15px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.18); color: #F3F0FF; margin-bottom: 12px; outline: none;
    font-family: -apple-system, sans-serif;
  }
  button {
    width: 100%; border: none; cursor: pointer; border-radius: 8px; padding: 13px;
    font-size: 15px; font-weight: 700; background: linear-gradient(90deg, #F2A93B, #E94F82); color: #100D24;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #E88A6E; font-size: 13px; margin-top: 10px; text-align: center; }
  .back-link { text-align: center; margin-top: 16px; }
  .back-link a { color: #F2A93B; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>

<div class="bg-glow"></div>
<svg class="satellite s1" viewBox="0 0 100 100" fill="none">
  <rect x="40" y="40" width="20" height="20" rx="2" fill="#F2A93B"/>
  <rect x="10" y="30" width="24" height="16" rx="2" stroke="#F2A93B" stroke-width="2.5" fill="none"/>
  <rect x="66" y="30" width="24" height="16" rx="2" stroke="#F2A93B" stroke-width="2.5" fill="none"/>
  <line x1="34" y1="38" x2="40" y2="42" stroke="#F2A93B" stroke-width="2.5"/>
  <line x1="66" y1="38" x2="60" y2="42" stroke="#F2A93B" stroke-width="2.5"/>
  <line x1="46" y1="60" x2="38" y2="78" stroke="#E94F82" stroke-width="2.5"/>
  <circle cx="36" cy="82" r="3" fill="#E94F82"/>
</svg>
<svg class="satellite s2" viewBox="0 0 100 100" fill="none">
  <rect x="40" y="40" width="20" height="20" rx="2" fill="#E94F82"/>
  <rect x="10" y="30" width="24" height="16" rx="2" stroke="#E94F82" stroke-width="2.5" fill="none"/>
  <rect x="66" y="30" width="24" height="16" rx="2" stroke="#E94F82" stroke-width="2.5" fill="none"/>
  <line x1="34" y1="38" x2="40" y2="42" stroke="#E94F82" stroke-width="2.5"/>
  <line x1="66" y1="38" x2="60" y2="42" stroke="#E94F82" stroke-width="2.5"/>
</svg>

<div class="wrap">
  <div class="eyebrow">Local Signal</div>
  <h1>Enter your code</h1>
  <p class="sub">Unlock unlimited generations across all six tools.</p>

  <div class="card">
    <input type="text" id="codeInput" placeholder="Your access code" />
    <button id="unlockBtn" onclick="unlock()">Unlock</button>
    <p class="error" id="errorMsg" style="display:none;"></p>
    <div class="back-link"><a href="/">← Back without unlocking</a></div>
  </div>
</div>

<script>
  async function unlock() {
    const code = document.getElementById('codeInput').value.trim();
    const btn = document.getElementById('unlockBtn');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    if (!code) return;

    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      if (code.toUpperCase().startsWith('SEO-')) {
        const res = await fetch('/api/redeem-appsumo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || 'Code not recognized.');
        }
      }
      localStorage.setItem('seo_unlocked', 'true');
      localStorage.setItem('seo_licenseCode', code);
      window.location.href = '/?welcome=1';
    } catch (err) {
      errorMsg.textContent = err.message || 'Something went wrong.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Unlock';
    }
  }

  document.getElementById('codeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') unlock();
  });
</script>

</body>
</html>
